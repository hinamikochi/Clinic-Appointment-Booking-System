services:
  db:
    image: mysql:8.0
    container_name: clinic_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: clinic_db
      MYSQL_USER: ${DB_USER:-clinic_app}
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Container Backend Node.js
  backend:
    build: ./backend
    container_name: clinic_backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DB_HOST=db
      - DB_USER=${DB_USER:-clinic_app}
      - DB_PASS=${DB_PASS:?Set DB_PASS in .env}
      - DB_NAME=clinic_db
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - NODE_ENV=production
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:8080}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - CLINIC_NAME=${CLINIC_NAME:-MyClinic}
      - CLINIC_ADDRESS=${CLINIC_ADDRESS:-}
      - CLINIC_PHONE=${CLINIC_PHONE:-}
      - CLINIC_INSTRUCTIONS=${CLINIC_INSTRUCTIONS:-}
    depends_on:
      db:
        condition: service_healthy

  # 3. Container Frontend React Nginx
  frontend:
    build: ./frontend
    container_name: clinic_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
